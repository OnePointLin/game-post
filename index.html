<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff1dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="郵局銷戳">
<meta name="format-detection" content="telephone=no">
<title>郵局銷戳大作戰</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #fde8d7; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { width: 100%; height: 100%; display: block; touch-action: none; }
  text { font-family: inherit; }
  .bob { animation: bob 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .puff { animation: puff 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puff { 0% { transform: translateY(0) scale(.6); opacity: .9; } 100% { transform: translateY(-26px) scale(1.25); opacity: 0; } }
  .float { animation: float 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .btn { cursor: pointer; }
  .btn .face { transition: transform .08s; }
  .btn:active .face, .btn.pressed .face { transform: translateY(4px); }
  .btn.disabled { opacity: .38; cursor: not-allowed; }
  .btn.disabled:active .face { transform: none; }
  .fade { transition: opacity .25s; }
  .warn { animation: warn .6s steps(2) infinite; }
  @keyframes warn { 50% { opacity: .35; } }
  .nopoint { pointer-events: none; }

  /* 手機橫放時提示轉直向 */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #fff6ec; color: #e07a5f; font-weight: 900; font-size: 20px;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #rotate svg { width: 90px; height: 90px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(-90deg); } 60%,100% { transform: rotate(0deg); } }
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<svg id="game" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8a5a3c" flood-opacity=".25"/>
    </filter>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="22" height="44" fill="#ffe9c9" opacity=".55"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#b9dfc4" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#f6d5b8"/>
      <circle cx="19" cy="19" r="2.2" fill="#f6d5b8"/>
    </pattern>
  </defs>
</svg>

<div id="rotate">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="8" width="44" height="84" rx="9" fill="#fff" stroke="#e07a5f" stroke-width="6"/>
    <rect x="42" y="16" width="16" height="4" rx="2" fill="#e07a5f"/>
    <circle cx="50" cy="82" r="4" fill="#e07a5f"/>
  </svg>
  <div>請把手機轉成直向來玩</div>
</div>

<script>
(() => {
'use strict';

/* ========== 版面設定（直向 540 × 960） ========== */
const LY = {
  W: 540, H: 960,
  front:   { x: 300, y: 404, s: 1.0 },
  queue:   { x0: 205, dx: 52, y: 388, s: .72, visible: 4 },
  rest:    { x: 270, y: 568, s: 1.45 },
  fromCust:{ x: 300, y: 330, s: .3 },
  plate:   { x: 135, y: 726, s: .4 },
  binTop:  { x: 405, y: 760, s: .3 },
  binIn:   { x: 405, y: 830, s: .2 },
  say:     { x: 322, y: 248 },
  boss:    { show: 400, hide: 780, y: 960, s: 1.3 },
};

/* ========== 基本工具 ========== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('game');
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clear = g => { while (g.firstChild) g.removeChild(g.firstChild); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const easeOut = t => 1 - Math.pow(1 - t, 3);
function tween(dur, fn, ease = easeOut) {
  return new Promise(res => {
    const t0 = performance.now();
    function step(now) {
      const t = Math.min(1, (now - t0) / dur);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });
}
function toSVG(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
const isTouch = matchMedia('(pointer: coarse)').matches;

/* ========== 音效 & 震動 ========== */
let actx = null, muted = false;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch (e) {}
}
function tone(freq, dur, type = 'sine', vol = .15, slide = 0, delay = 0) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function buzz(p) { if (muted) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
const sfx = {
  stamp: () => { tone(140, .12, 'square', .1, .45); tone(90, .1, 'sine', .15, .6, .01); buzz(15); },
  ding: () => { tone(880, .14, 'sine', .14); tone(1320, .22, 'sine', .12, 0, .09); buzz(10); },
  weigh: () => tone(620, .08, 'triangle', .12),
  error: () => { tone(220, .25, 'sawtooth', .1, .7); tone(160, .35, 'sawtooth', .1, .7, .2); buzz([90, 60, 160]); },
  pop: () => tone(480, .1, 'sine', .12, 1.8),
  back: () => tone(520, .18, 'triangle', .12, .55),
  click: () => { tone(700, .05, 'triangle', .08); buzz(8); },
};

/* ========== 遊戲資料 ========== */
const RATES = [
  { type: 'letter', max: 20, fee: 8 },
  { type: 'letter', max: 50, fee: 16 },
  { type: 'letter', max: 100, fee: 24 },
  { type: 'letter', max: 250, fee: 40 },
  { type: 'letter', max: 500, fee: 72 },
  { type: 'parcel', max: 1000, fee: 95 },
  { type: 'parcel', max: 2000, fee: 125 },
  { type: 'parcel', max: 3000, fee: 155 },
  { type: 'parcel', max: 5000, fee: 205 },
];
const DENOMS = [1, 2, 3, 5, 7, 8, 10, 12, 15, 20, 25, 32, 50];
const COLORS = ['#ffb5c2', '#a0d2eb', '#b8e0a8', '#ffd98e', '#cdb4db', '#ffc09f', '#9ad1c9', '#f7b2d9'];
const ENV = ['#ffffff', '#fff0f3', '#eef6ff', '#fffbe6', '#f1fbef'];
const NAMES = ['林小美', '陳大熊', '王小明', '張兔兔', '李阿喵', '黃小雞', '吳柚子', '周布丁', '許湯圓', '鄭豆花', '蔡麻糬', '劉芋圓'];
const ADDRS = ['台北市大安區幸福路 8 號', '新北市板橋區棉花糖街 12 號', '台中市西屯區彩虹巷 3 號', '台南市中西區布丁路 21 號',
  '高雄市苓雅區海鷗街 66 號', '花蓮縣吉安鄉月光路 5 號', '新竹市東區星星路 18 號', '宜蘭縣礁溪鄉溫泉路 7 號'];
const SENDERS = ['小熊', '喵喵', '兔兔', '小黃', '阿柴', '胖虎'];
const GREET = ['麻煩你了～', '我要寄這個！', '請幫我寄～', '要寄喔！', '拜託了～'];
const BYE = ['謝謝～', '辛苦了！', '掰掰～', '感謝您！'];
const DIFF = {
  easy:   { name: '輕鬆', mps: 2.0, s0: 11,  s1: 7,   qmax: 8 },
  normal: { name: '普通', mps: 2.0, s0: 9,   s1: 5.2, qmax: 7 },
  hard:   { name: '忙碌', mps: 2.2, s0: 7.5, s1: 4,   qmax: 6 },
};
const START_MIN = 8 * 60 + 30, END_MIN = 17 * 60;
const today = new Date();
const DATE_STR = `${today.getFullYear() - 1911}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;

/* ========== 圖層 ========== */
const L = {};
['bg', 'queue', 'desk', 'item', 'ghost', 'ui', 'boss', 'hud', 'pause', 'overlay'].forEach(n => L[n] = el('g', { id: 'L_' + n }, svg));
L.ghost.classList.add('nopoint');
L.ui.classList.add('nopoint');

let D = DIFF.normal;
let G = { state: 'menu', runId: 0, waiting: [], all: [] };
const H = {};
const boss = { x: LY.boss.hide, tx: LY.boss.hide, active: false, elapsed: 0 };
// 全螢幕背景（螢幕比例比 540:960 更長時，上下延伸）
const FULL = { x: -600, y: -700, width: 1740, height: 2360 };

/* ========== 郵票圖案 ========== */
const ICONS = {
  flower(g, x, y) {
    for (let i = 0; i < 5; i++) {
      const a = (i * 72 - 90) * Math.PI / 180;
      el('circle', { cx: x + Math.cos(a) * 6.5, cy: y + Math.sin(a) * 6.5, r: 5, fill: '#fff' }, g);
    }
    el('circle', { cx: x, cy: y, r: 4, fill: '#ffb703' }, g);
  },
  heart(g, x, y) {
    el('path', { d: `M ${x} ${y + 9} C ${x - 15} ${y} ${x - 9} ${y - 12} ${x} ${y - 4} C ${x + 9} ${y - 12} ${x + 15} ${y} ${x} ${y + 9} Z`, fill: '#ff5d8f' }, g);
  },
  star(g, x, y) {
    let pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 4.8 : 11, a = (i * 36 - 90) * Math.PI / 180;
      pts.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + 1 + Math.sin(a) * r).toFixed(1));
    }
    el('polygon', { points: pts.join(' '), fill: '#fff6a5', stroke: '#e9a23b', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
  },
  cat(g, x, y) {
    el('polygon', { points: `${x - 9},${y - 3} ${x - 7},${y - 12} ${x - 2},${y - 7}`, fill: '#fff' }, g);
    el('polygon', { points: `${x + 9},${y - 3} ${x + 7},${y - 12} ${x + 2},${y - 7}`, fill: '#fff' }, g);
    el('circle', { cx: x, cy: y + 1, r: 9, fill: '#fff' }, g);
    el('circle', { cx: x - 3.5, cy: y, r: 1.5, fill: '#333' }, g);
    el('circle', { cx: x + 3.5, cy: y, r: 1.5, fill: '#333' }, g);
    el('circle', { cx: x, cy: y + 3.5, r: 1.2, fill: '#ff8fa3' }, g);
  },
  fish(g, x, y) {
    el('polygon', { points: `${x + 6},${y} ${x + 14},${y - 6} ${x + 14},${y + 6}`, fill: '#fff' }, g);
    el('ellipse', { cx: x - 2, cy: y, rx: 10, ry: 6.5, fill: '#fff' }, g);
    el('circle', { cx: x - 6, cy: y - 1.5, r: 1.6, fill: '#333' }, g);
  },
  mountain(g, x, y) {
    el('circle', { cx: x + 7, cy: y - 6, r: 4.5, fill: '#ffb703' }, g);
    el('polygon', { points: `${x - 13},${y + 9} ${x - 3},${y - 5} ${x + 3},${y + 2} ${x + 7},${y - 2} ${x + 13},${y + 9}`, fill: '#fff' }, g);
  },
  bird(g, x, y) {
    el('circle', { cx: x - 1, cy: y + 1, r: 8, fill: '#fff' }, g);
    el('polygon', { points: `${x + 6},${y - 2} ${x + 12},${y} ${x + 6},${y + 2}`, fill: '#ffb703' }, g);
    el('circle', { cx: x + 2, cy: y - 2, r: 1.4, fill: '#333' }, g);
    el('path', { d: `M ${x - 6} ${y + 1} Q ${x - 2} ${y + 7} ${x + 2} ${y + 2}`, fill: 'none', stroke: '#ddd', 'stroke-width': 1.5 }, g);
  },
};
const ICON_KEYS = Object.keys(ICONS);

function drawStamp(p, x, y, v, meta, bg) {
  const g = el('g', { transform: `translate(${x},${y})` }, p);
  el('rect', { width: 48, height: 58, fill: '#fffdf7' }, g);
  el('rect', { width: 48, height: 58, fill: 'none', stroke: bg, 'stroke-width': 5, 'stroke-dasharray': '0 6.6', 'stroke-linecap': 'round' }, g);
  el('rect', { x: 5, y: 5, width: 38, height: 48, rx: 3, fill: meta.color }, g);
  ICONS[meta.icon](g, 24, 20);
  const t = el('text', { x: 24, y: 48, 'text-anchor': 'middle', 'font-size': v >= 10 ? 16 : 17, 'font-weight': 900, fill: '#3d2c2e', text: v }, g);
  el('tspan', { 'font-size': 8, dx: 1, text: '元' }, t);
  return g;
}

function drawPostmark(parent, x, y, rot, timeStr) {
  const g = el('g', { transform: `translate(${x},${y}) rotate(${rot})`, opacity: .85 }, parent);
  const ink = '#3d2f6e';
  for (const k of [-13, 0, 13]) {
    el('path', { d: `M 33 ${k} q 8 -6 16 0 t 16 0 t 16 0 t 16 0`, fill: 'none', stroke: ink, 'stroke-width': 2.6, 'stroke-linecap': 'round' }, g);
  }
  el('circle', { r: 30, fill: 'rgba(255,255,255,0.05)', stroke: ink, 'stroke-width': 3 }, g);
  el('circle', { r: 23, fill: 'none', stroke: ink, 'stroke-width': 1.3 }, g);
  el('line', { x1: -23, y1: -6, x2: 23, y2: -6, stroke: ink, 'stroke-width': 1.3 }, g);
  el('line', { x1: -23, y1: 8, x2: 23, y2: 8, stroke: ink, 'stroke-width': 1.3 }, g);
  el('text', { x: 0, y: -10, 'text-anchor': 'middle', 'font-size': 8, 'font-weight': 700, fill: ink, text: '幸福郵局' }, g);
  el('text', { x: 0, y: 4.5, 'text-anchor': 'middle', 'font-size': 8.5, 'font-weight': 800, fill: ink, text: DATE_STR }, g);
  el('text', { x: 0, y: 19, 'text-anchor': 'middle', 'font-size': 8, 'font-weight': 700, fill: ink, text: timeStr }, g);
  return g;
}

/* ========== 吉祥物 / 魷魚 ========== */
function drawMascot(parent, x, y, happy = true) {
  const g = el('g', { transform: `translate(${x},${y})` }, parent);
  const f = el('g', { class: 'float' }, g);
  el('ellipse', { cx: -78, cy: 10, rx: 12, ry: 8, fill: '#fff', stroke: '#e0c3a8', 'stroke-width': 3 }, f);
  el('ellipse', { cx: 78, cy: 10, rx: 12, ry: 8, fill: '#fff', stroke: '#e0c3a8', 'stroke-width': 3 }, f);
  el('rect', { x: -70, y: -45, width: 140, height: 90, rx: 12, fill: '#fff', stroke: '#e0c3a8', 'stroke-width': 3 }, f);
  el('path', { d: 'M -68 -42 L 0 6 L 68 -42', fill: 'none', stroke: '#e0c3a8', 'stroke-width': 3, 'stroke-linejoin': 'round' }, f);
  const st = el('g', { transform: 'translate(36,-38) rotate(8)' }, f);
  el('rect', { width: 26, height: 30, fill: '#ffb5c2', stroke: '#fff', 'stroke-width': 2 }, st);
  ICONS.heart(st, 13, 15);
  if (happy) {
    el('path', { d: 'M -28 20 Q -22 13 -16 20', fill: 'none', stroke: '#3a2a2a', 'stroke-width': 3, 'stroke-linecap': 'round' }, f);
    el('path', { d: 'M 16 20 Q 22 13 28 20', fill: 'none', stroke: '#3a2a2a', 'stroke-width': 3, 'stroke-linecap': 'round' }, f);
  } else {
    el('circle', { cx: -22, cy: 18, r: 5, fill: '#3a2a2a' }, f);
    el('circle', { cx: 22, cy: 18, r: 5, fill: '#3a2a2a' }, f);
  }
  el('ellipse', { cx: -36, cy: 28, rx: 8, ry: 4.5, fill: '#ff9fb0', opacity: .75 }, f);
  el('ellipse', { cx: 36, cy: 28, rx: 8, ry: 4.5, fill: '#ff9fb0', opacity: .75 }, f);
  el('path', { d: 'M -8 27 Q 0 35 8 27', fill: 'none', stroke: '#3a2a2a', 'stroke-width': 3, 'stroke-linecap': 'round' }, f);
  return g;
}

function drawSquid(parent, x, y) {
  const g = el('g', { transform: `translate(${x},${y}) scale(.9)` }, parent);
  el('rect', { x: 110, y: 40, width: 120, height: 16, rx: 8, fill: '#9a8c98' }, g);
  el('ellipse', { cx: 0, cy: 50, rx: 122, ry: 28, fill: '#4a4e69' }, g);
  el('ellipse', { cx: 0, cy: 45, rx: 108, ry: 19, fill: '#22223b' }, g);
  const c = '#ff8fa3';
  for (let i = 0; i < 6; i++) {
    const tx = -40 + i * 16;
    el('path', { d: `M ${tx} -6 q 9 12 0 24 t 0 24`, fill: 'none', stroke: c, 'stroke-width': 10, 'stroke-linecap': 'round' }, g);
  }
  el('polygon', { points: '-36,-88 -72,-58 -42,-52', fill: c }, g);
  el('polygon', { points: '36,-88 72,-58 42,-52', fill: c }, g);
  el('path', { d: 'M 0 -125 C 48 -92 58 -30 50 0 L -50 0 C -58 -30 -48 -92 0 -125 Z', fill: c }, g);
  el('ellipse', { cx: -14, cy: -80, rx: 8, ry: 14, fill: '#fff', opacity: .35 }, g);
  for (const ex of [-18, 18]) {
    el('circle', { cx: ex, cy: -30, r: 11, fill: '#fff' }, g);
    el('circle', { cx: ex, cy: -27, r: 6, fill: '#3a2a2a' }, g);
    el('circle', { cx: ex + 2, cy: -29, r: 2, fill: '#fff' }, g);
  }
  el('ellipse', { cx: 0, cy: -10, rx: 5, ry: 6, fill: '#c9184a' }, g);
  el('path', { d: 'M 58 -100 Q 66 -86 58 -80 Q 50 -86 58 -100 Z', fill: '#8ecae6' }, g);
  for (const sx of [-90, 80]) {
    const p = el('path', { d: `M ${sx} 10 q -8 -12 0 -24 t 0 -24`, fill: 'none', stroke: '#cbc0d3', 'stroke-width': 5, 'stroke-linecap': 'round', class: 'puff' }, g);
    p.style.animationDuration = '1.6s';
  }
  return g;
}

/* ========== 背景（牆面 / 大廳） ========== */
function buildBG() {
  const g = L.bg;
  el('rect', { x: 0, y: -700, width: 540, height: 1100, fill: '#fff1dc' }, g);
  el('rect', { x: 0, y: -700, width: 540, height: 1100, fill: 'url(#stripes)' }, g);
  el('rect', { x: 0, y: 340, width: 540, height: 60, fill: '#f3d3ad' }, g);
  el('rect', { x: 0, y: 336, width: 540, height: 6, fill: '#e2b88c' }, g);

  // 招牌
  const sg = el('g', { transform: 'translate(14,116)' }, g);
  el('rect', { width: 170, height: 44, rx: 15, fill: '#52b788', filter: 'url(#sh)' }, sg);
  el('rect', { x: 13, y: 12, width: 30, height: 21, rx: 4, fill: '#fff' }, sg);
  el('path', { d: 'M 14 13 L 28 24 L 42 13', fill: 'none', stroke: '#52b788', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, sg);
  el('text', { x: 106, y: 30, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 900, fill: '#fff', text: '幸福郵局' }, sg);

  // 彩旗
  const p0 = [196, 118], p1 = [290, 142], p2 = [384, 118];

function updateHUD() {

  const hh = Math.floor(m / 60), mm = Math.floor(m % 60);
  H.time.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  H.score.textContent = G.score;
  H.sent.textContent = G.sent;
  const q = G.waiting.length;
  H.queue.textContent = q + ' 人';
  H.queue.setAttribute('fill', q >= D.qmax - 2 ? '#e63946' : '#5a4a42');
  H.queue.classList.toggle('warn', q >= D.qmax - 1);
  H.anger.forEach((c, i) => c.setAttribute('fill', i < G.anger ? '#ff6b6b' : '#ece4da'));
  H.combo.textContent = G.combo >= 2 ? `連擊 ×${G.combo}` : '';
  H.hourHand.setAttribute('transform', `rotate(${(m / 60 % 12) * 30})`);
  H.minHand.setAttribute('transform', `rotate(${(m % 60) * 6})`);
}

/* ========== 信件產生 ========== */
const progress = () => clamp((G.min - START_MIN) / (END_MIN - START_MIN), 0, 1);
function makeStamps(total, n) {
  n = Math.min(Math.max(n, Math.ceil(total / 50)), 10, Math.max(1, Math.floor(total / 1.5)));
  if (n === 1 && DENOMS.includes(total)) return [total];
  for (let t = 0; t < 600 && n > 1; t++) {
    const avg = total / n, parts = [];
    let s = 0;
    let cands = DENOMS.filter(d => d >= avg * .3 && d <= avg * 1.8);
    if (!cands.length) cands = DENOMS.filter(d => d <= Math.max(2, avg * 2));
    for (let i = 0; i < n - 1; i++) { const d = pick(cands); parts.push(d); s += d; }
    const r = total - s;
    if (r > 0 && DENOMS.includes(r)) { parts.push(r); return shuffle(parts); }
  }
  const parts = []; let rem = total;
  while (rem > 0) { const d = [...DENOMS].reverse().find(x => x <= rem); parts.push(d); rem -= d; }
  return shuffle(parts);
}
function genItem() {
  const p = progress();
  const parcel = Math.random() < .2 + p * .15;
  const rates = RATES.filter(r => r.type === (parcel ? 'parcel' : 'letter'));
  const idx = randInt(0, rates.length - 1), r = rates[idx];
  const lo = idx === 0 ? (parcel ? 501 : 3) : rates[idx - 1].max + 1;
  const weight = randInt(lo, r.max);
  const fee = r.fee;
  let total;
  if (Math.random() < .6) {
    total = fee + (Math.random() < .55 ? 0 : randInt(1, 6));
  } else {
    const sMax = Math.max(2, Math.round(12 - 10 * p));
    const sMin = Math.min(sMax, Math.max(1, Math.round(4 - 3 * p)));
    total = fee - Math.min(fee - 1, randInt(sMin, sMax));
  }
  const n = randInt(1 + Math.floor(p * 2), 3 + Math.floor(p * 5));
  const vals = makeStamps(total, n);
  return {
    type: parcel ? 'parcel' : 'letter', weight, fee, vals,
    meta: vals.map(() => ({ color: pick(COLORS), icon: pick(ICON_KEYS) })),
    env: pick(ENV), air: Math.random() < .3, name: pick(NAMES), title: pick(['先生', '小姐']),
    addr: pick(ADDRS), sender: pick(SENDERS), zip: String(randInt(100, 980)),
  };
}
function fixItem(it) {
  const short = it.fee - it.sum;
  const d = DENOMS.find(x => x >= short) || 50;
  return Object.assign({}, it, {
    vals: [...it.vals, d],
    meta: [...it.meta, { color: pick(COLORS), icon: pick(ICON_KEYS) }],
    weighed: false, g: null, stamps: null,
  });
}

function toggleMute() {
  muted = !muted;
  H.wave.style.display = muted ? 'none' : '';
  H.mx.style.display = muted ? '' : 'none';
}

/* ========== 畫面 ========== */
function overlayButton(parent, x, y, w, h, color, shade, label, sub, onClick) {
  const g = el('g', { transform: `translate(${x},${y})`, class: 'btn' }, parent);
  el('rect', { y: 6, width: w, height: h, rx: 22, fill: shade }, g);
  const f = el('g', { class: 'face' }, g);
  el('rect', { width: w, height: h, rx: 22, fill: color }, f);
  el('rect', { x: 14, y: 7, width: w - 28, height: 8, rx: 4, fill: '#fff', opacity: .35 }, f);
  el('text', { x: w / 2, y: sub ? h / 2 + 3 : h / 2 + 9, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 900, fill: '#4a3b33', text: label }, f);
  if (sub) el('text', { x: w / 2, y: h / 2 + 22, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#6b5446', text: sub }, f);
  g.addEventListener('click', e => { e.stopPropagation(); unlockAudio(); onClick(); });
  return g;
}
function overlayBG(o, color) {
  el('rect', Object.assign({ fill: color, opacity: .97 }, FULL), o);
  el('rect', Object.assign({ fill: 'url(#dots)', opacity: .6 }, FULL), o);
}

function showStart() {
  G.state = 'menu';
  clear(L.overlay); clear(L.pause);
  const o = L.overlay;
  overlayBG(o, '#fff6ec');
  [[22, 40, -12, 8], [462, 56, 10, 25], [30, 214, 8, 12], [470, 222, -8, 50]].forEach(([x, y, r, v]) => {
    const g = el('g', { transform: `translate(${x},${y}) rotate(${r})` }, o);
    drawStamp(g, 0, 0, v, { color: pick(COLORS), icon: pick(ICON_KEYS) }, '#fff6ec');
  });
  drawMascot(o, 270, 150, true);
  el('text', { x: 270, y: 272, 'text-anchor': 'middle', 'font-size': 46, 'font-weight': 900, fill: '#e07a5f', stroke: '#fff', 'stroke-width': 8, 'paint-order': 'stroke', text: '郵局銷戳大作戰' }, o);
  el('text', { x: 270, y: 308, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#a0785a', text: '上班時間 08:30 – 17:00' }, o);
  el('text', { x: 270, y: 332, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#a0785a', text: '撐到下班就是勝利！' }, o);
  el('rect', { x: 20, y: 352, width: 500, height: 334, rx: 22, fill: '#fff', stroke: '#f2cc8f', 'stroke-width': 3 }, o);
  const lines = [
    ['客人遞來信件或包裹，', '先按「秤重」看要付多少郵資。'],
    ['心算信上所有郵票的面額加總，', '跟郵資比一比！'],
    ['郵資足夠：點郵票蓋上郵戳，', '圓圈要蓋到每一張，再按「寄出」。'],
    ['郵資不足：按「退回」', '把信推回給客人。'],
    ['錯寄、漏蓋、錯退、排隊太長會被罵，', '主管罵 3 次就被炒魷魚！'],
  ];
  lines.forEach(([a, b], i) => {
    const y = 390 + i * 62;
    el('circle', { cx: 48, cy: y - 6, r: 14, fill: COLORS[i] }, o);
    el('text', { x: 48, y: y - 1, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: '#5a4a42', text: i + 1 }, o);
    el('text', { x: 74, y, 'font-size': 16, 'font-weight': 800, fill: '#5a4a42', text: a }, o);
    el('text', { x: 74, y: y + 24, 'font-size': 16, 'font-weight': 700, fill: '#7a6458', text: b }, o);
  });
  overlayButton(o, 100, 704, 340, 62, '#b8e0a8', '#86b878', '輕鬆', '客人少，慢慢來', () => startGame('easy'));
  overlayButton(o, 100, 780, 340, 62, '#ffd98e', '#d9ac5c', '普通', '標準的一天', () => startGame('normal'));
  overlayButton(o, 100, 856, 340, 62, '#ffb4a2', '#d98a78', '忙碌', '週一早上的郵局', () => startGame('hard'));
  el('text', { x: 270, y: 948, 'text-anchor': 'middle', 'font-size': 12, fill: '#b08968',
    text: isTouch ? '小技巧：加入主畫面，就能全螢幕遊玩' : '鍵盤：W 秤重　R 退回　S 寄出　P 暫停　M 靜音' }, o);
}

function showEnd(win) {
  G.state = win ? 'win' : 'over';
  hideGhost(); clear(L.pause); setHint(); updateButtons();
  clear(L.overlay);
  const o = L.overlay;
  overlayBG(o, win ? '#fff6ec' : '#fdecef');
  if (win) {
    const stars = 3 - G.anger;
    for (let i = 0; i < 3; i++) {
      const x = 210 + i * 60, y = 100, pts = [];
      for (let k = 0; k < 10; k++) {
        const r = k % 2 ? 10 : 24, a = (k * 36 - 90) * Math.PI / 180;
        pts.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + Math.sin(a) * r).toFixed(1));
      }
      el('polygon', { points: pts.join(' '), fill: i < stars ? '#ffd166' : '#e9e2da', stroke: i < stars ? '#e9a23b' : '#d6ccc2', 'stroke-width': 3, 'stroke-linejoin': 'round' }, o);
    }
    drawMascot(o, 270, 240, true);
  } else {
    drawSquid(o, 250, 250);
  }
  el('text', { x: 270, y: 380, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 900, fill: win ? '#e07a5f' : '#e63946', stroke: '#fff', 'stroke-width': 8, 'paint-order': 'stroke', text: win ? '下班囉！辛苦了～' : '你被炒魷魚了！' }, o);
  el('rect', { x: 50, y: 410, width: 440, height: 188, rx: 22, fill: '#fff', stroke: '#f2cc8f', 'stroke-width': 3 }, o);
  const mn = Math.min(G.min, END_MIN), hh = Math.floor(mn / 60), mm = Math.floor(mn % 60);
  const stats = [
    ['難度', D.name],
    [win ? '下班時間' : '撐到', String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0')],
    ['正確寄出 / 正確退件', `${G.sent} 件 / ${G.returned} 件`],
    ['主管怒氣', `${G.anger} / 3`],
    ['總分', String(G.score)],
  ];
  stats.forEach(([a, b], i) => {
    el('text', { x: 78, y: 448 + i * 34, 'font-size': 17, 'font-weight': 700, fill: '#a0785a', text: a }, o);
    el('text', { x: 462, y: 448 + i * 34, 'text-anchor': 'end', 'font-size': i === 4 ? 24 : 18, 'font-weight': 900, fill: i === 4 ? '#e07a5f' : '#5a4a42', text: b }, o);
  });
  overlayButton(o, 135, 640, 270, 68, '#a7dcb9', '#72b58b', '再上一天班', '', showStart);
  if (win) sfx.ding(); else { tone(392, .25, 'triangle', .12); tone(330, .25, 'triangle', .12, 0, .25); tone(262, .5, 'triangle', .12, 0, .5); buzz([120, 80, 120, 80, 240]); }
}

/* ========== 遊戲開始 ========== */
function startGame(key) {
  D = DIFF[key];
  const rid = (G.runId || 0) + 1;
  G = { state: 'playing', paused: false, min: START_MIN, score: 0, sent: 0, returned: 0, combo: 0, anger: 0,
        waiting: [], all: [], front: null, item: null, desk: 'idle', spawnT: 3, queueCD: 0, runId: rid, outCount: 0, lunchShown: false, endShown: false };
  clear(L.queue); clear(L.item); clear(L.ui); clear(H.pile); clear(L.overlay); clear(L.pause);
  boss.active = false; boss.x = boss.tx = LY.boss.hide; applyBoss();
  H.dim.style.opacity = 0; H.bossBubble.style.opacity = 0;
  H.binCount.textContent = '0 件';
  resetDisplay();
  for (let i = 0; i < 2; i++) spawnCustomer();
  G.waiting.forEach(c => { c.x = c.tx; applyCust(c); });
  sfx.ding();
  setHint(); updateButtons(); updateHUD();
}

/* ========== 主迴圈 ========== */
function spawnInterval() {
  const p = progress();
  let iv = D.s0 + (D.s1 - D.s0) * p;
  if (G.min >= 720 && G.min < 780) iv *= .7;
  return iv * (.7 + Math.random() * .6);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  requestAnimationFrame(loop);
}
function update(dt) {
  const running = G.state === 'playing' && !G.paused && !boss.active;
  if (running) {
    G.min += dt * D.mps;
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      spawnCustomer();
      if (progress() > .5 && Math.random() < .15) spawnCustomer();
      G.spawnT = spawnInterval();
    }
    if (!G.lunchShown && G.min >= 720) { G.lunchShown = true; popup('午休人潮湧入！', 270, 290, '#e07a5f', 32, 1800); }
    if (!G.endShown && G.min >= 990) { G.endShown = true; popup('再撐 30 分鐘就下班！', 270, 290, '#2a9d8f', 28, 1800); }
    G.queueCD -= dt;
    if (G.waiting.length >= D.qmax && G.queueCD <= 0) {
      for (let k = 0; k < 2 && G.waiting.length; k++) {
        const c = G.waiting.pop();
        c.leaving = true; c.tx = -160; c.g.style.display = '';
        setMood(c, true);
      }
      layoutQueue();
      scold('排隊排到門口了！動作快！\n有客人等不及走掉了！');
      G.queueCD = 20;
    }
    if (G.min >= END_MIN) { G.min = END_MIN; showEnd(true); }
  }

  if (G.state === 'playing' && !boss.active && !G.front && G.desk === 'idle' && !G.item && G.waiting.length) advance();

  const crowd = G.waiting.length >= D.qmax - 2;
  G.waiting.forEach(c => setMood(c, crowd));
  for (let i = G.all.length - 1; i >= 0; i--) {
    const c = G.all[i];
    const k = Math.min(1, dt * (c.leaving ? 2.6 : 5));
    c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k; c.s += (c.ts - c.s) * k;
    applyCust(c);
    if (c.leaving && (c.x > 640 || c.x < -100)) { c.g.remove(); G.all.splice(i, 1); }
  }
  if (G.state === 'playing' && G.front && !G.front.handed && Math.abs(G.front.x - LY.front.x) < 10) {
    G.front.handed = true;
    handOver(G.front);
  }

  boss.x += (boss.tx - boss.x) * Math.min(1, dt * 7);
  applyBoss();
  if (boss.active) { boss.elapsed += dt; if (boss.elapsed > 3.4) dismissBoss(); }

  if (G.state === 'playing') { updateHUD(); updateButtons(); }
}

/* ========== 輸入 ========== */
svg.addEventListener('pointerdown', e => {
  unlockAudio();
  if (boss.active) { if (boss.elapsed > .6) dismissBoss(); return; }
  if (G.state !== 'playing' || G.paused) return;
  const p = toSVG(e);
  // 觸控時邊緣放寬 12 單位，手指比較好點
  if (canAct() && hitItem(G.item, p, e.pointerType === 'mouse' ? 0 : 12)) {
    e.preventDefault();
    stampAt(G.item, p);
  }
});
svg.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !canAct()) { hideGhost(); return; }
  const p = toSVG(e);
  if (hitItem(G.item, p)) {
    H.ghost.style.display = '';
    H.ghost.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    svg.style.cursor = 'none';
  } else hideGhost();
});
svg.addEventListener('pointerleave', hideGhost);
svg.addEventListener('contextmenu', e => e.preventDefault());
// 防止 iOS 雙擊縮放、捏合縮放、頁面回彈
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') { toggleMute(); return; }
  if (G.state !== 'playing') return;
  if (boss.active) { if (boss.elapsed > .6 && (k === ' ' || k === 'enter')) dismissBoss(); return; }
  if (k === 'p') togglePause();
  else if (G.paused) return;
  else if (k === 'w') doWeigh();
  else if (k === 'r') doReturn();
  else if (k === 's') doSend();
});
// 切到其他 App、鎖螢幕或手機橫放時自動暫停
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });
const landscapeMQ = matchMedia('(orientation: landscape) and (max-height: 520px)');
const onOrient = () => { if (landscapeMQ.matches) togglePause(true); };
if (landscapeMQ.addEventListener) landscapeMQ.addEventListener('change', onOrient); else landscapeMQ.addListener(onOrient);

/* ========== 啟動 ========== */
buildBG();
buildDesk();
buildHUD();
buildBoss();
showStart();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
